# RAG 项目配置文件 - Ollama 本地全栈方案

# Embedding 模型配置
embedding:
  type: "ollama"  # ollama | local_hf | api
  ollama:
    model_name: "bge-m3"  # 多语言，中文效果优秀
    base_url: "http://localhost:11434"
  local_hf:
    model_name: "BAAI/bge-base-zh-v1.5"
    max_length: 512
    batch_size: 32
  api:
    provider: "openai"
    model_name: "text-embedding-3-small"
    api_key: "${EMBEDDING_API_KEY}"
    base_url: "https://api.openai.com/v1"
    batch_size: 16

# Rerank 模型配置
rerank:
  enabled: true  # 已下载 bge-reranker-base 到本地
  type: "local"  # local | api
  local:
    model_name: "bge-reranker-base"
    model_path: "./models/rerank/bge-reranker-base"
    max_length: 512
    candidate_k: 20  # 精排前召回的候选数量（越多越准，但越慢）
  api:
    provider: "cohere"
    model_name: "rerank-v3.5"
    api_key: "${RERANK_API_KEY}"

# LLM 配置
llm:
  type: "local"  # local（Ollama） | api
  local:
    model_name: "qwen2.5:7b"
    base_url: "http://localhost:11434"
    max_tokens: 2048
    temperature: 0.7
    # 模型上下文窗口。不设的话 Ollama 按自己的默认值裁提示词，
    # 检索资料一多就出现"命中了但模型说不知道"（实测见 backend/eval/RESULTS.md F13）
    num_ctx: 8192
  api:
    provider: "deepseek"
    model_name: "deepseek-chat"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"
    max_tokens: 2048
    temperature: 0.7
    stream: true

# 向量数据库配置
vectorstore:
  type: "chromadb"  # chromadb | milvus
  chromadb:
    path: "./data/chroma_db"
    collection_name: "rag_collection"
  milvus:
    host: "localhost"
    port: 19530
    collection_name: "rag_collection"

# 文档切分配置
chunking:
  strategy: "recursive"  # recursive | parent_child
  parent:
    chunk_size: 800
    chunk_overlap: 200
  child:
    chunk_size: 200
    chunk_overlap: 50

# 检索配置
retrieval:
  search_type: "mmr"  # similarity | mmr
  search_kwargs:
    k: 5  # 最终返回数量
    fetch_k: 20  # MMR 候选数量
    lambda_mult: 0.7  # MMR 多样性权重（0=多样性，1=相关性）
  # 双路检索：向量召回 + BM25 关键词召回，RRF 融合后再精排
  hybrid:
    enabled: true   # 评测依据：双路+RRF 的 MRR@5 0.890 最高，且比纯精排快 5.5 倍（见 backend/eval/RESULTS.md）
    bm25_top_k: 20  # BM25 单路召回数量
    rrf_k: 60  # RRF 平滑常数（经验值 60）
  multi_query:
    enabled: false  # 暂不启用，后续实现
    num_queries: 3
  # 最终进入提示词的资料字符预算（14 块全召回约 9000 字，会把 8192 的窗口撑爆）
  # 按名次从后往前丢，至少保留 1 条；设 0 表示不裁剪
  max_context_chars: 6000

# Agent 配置（Agentic RAG：由 LLM 自主决定检索策略）
agent:
  enabled: true
  max_iterations: 8    # LangGraph 递归上限，一次工具调用约占 2 步
  max_search_calls: 4  # 提示词中约束的检索次数上限，防止无限改写查询
  temperature: 0.1     # 工具调用要稳定，比生成回答（0.7）低

# 对话配置
conversation:
  memory_type: "buffer"  # buffer | summary | entity
  max_history: 10  # 最大对话轮数
  condense_question: false  # 问题改写（后续实现）

# 高并发配置
async:
  enabled: true
  max_connections: 100
  timeout: 30

# 检索结果缓存
# 存在的理由：/chat 这类接口会"先取来源再走生成"，同一个问题实际检索两遍，
# 精排在 CPU 上很贵，这层缓存就是吃掉这份重复。
cache:
  enabled: true
  type: "memory"   # 目前只实现进程内内存缓存，多进程/多副本之间不共享
  ttl: 60          # 秒。文档上传/删除会立刻清空缓存，所以这里只需挡住同一问题的重复检索
  max_size: 200    # 最多缓存多少个问题（超出按最近未使用淘汰）
