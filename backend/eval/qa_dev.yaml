# 检索评测集（retrieval-only gold labels）
#
# 标注方式说明：
#   不记录 chunk 序号或向量库 id（重建索引后会失效），而是记录 gold 块里
#   必然出现的特征串。跑评测时按特征串在语料里反查，标注重建后依然成立。
#
# category 用于分类别统计，这比总分更有信息量：
#   keyword        —— 查询词和文档字面高度重合，BM25 应占优
#   semantic       —— 需要语义理解，向量应占优
#   cross_lingual  —— 中英文混用，考察 embedding 的跨语种能力
#   multi_topic    —— 一句话牵多个线索，考验融合与精排

